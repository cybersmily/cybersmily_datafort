<div>
  <h4 class="d-inline me-3">{{header}}</h4>
  <fa-icon [icon]="faDice" class="csd-btn csd-icon-btn csd-icon-xl" (click)="generateRandom(lifepathSource)"></fa-icon>
</div>
<div class="csd-rounded csd-lifepath-sect">
  @for (chart of chartData; track chart; let i = $index) {
    <div>
      <div style="display:inline-block;">
        <h6>{{chart.title}}: </h6>
        <select [(ngModel)]="selectedValues[chart.title]" (change)="onSelected($event, chart.title)">
          <option value="?" selected="selected"></option>
          @for (opt of filterData(chart.options, lifepathSource); track opt) {
            <option>{{opt}}</option>
          }
        </select>
      </div>
    </div>
  }
