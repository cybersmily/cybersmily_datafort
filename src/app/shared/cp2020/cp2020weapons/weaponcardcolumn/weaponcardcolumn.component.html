<div>
  <accordion #accordion>
    @for (grp of weapons; track grp; let i = $index) {
      <accordion-group heading="">
        <div accordion-heading>
          <h3 style="display:inline-block">{{grp.name}}</h3>
          <fa-icon [icon]="accordion.groups[i].isOpen?faAngleDoubleDown:faAngleDoubleRight" size="2x"></fa-icon>
        </div>
        <div class="row">
          @for (weapon of grp.guns; track weapon) {
            <cs-weaponcard [wpn]="weapon" class="col-12 col-md-6 col-lg-4 col-xl-3"></cs-weaponcard>
          }
        </div>
      </accordion-group>
    }
  </accordion>
</div>
