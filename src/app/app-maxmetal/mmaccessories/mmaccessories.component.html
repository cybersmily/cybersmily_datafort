<h4 >WEAPONS</h4>
<accordion>
  @for (cat of weapons; track cat) {
    <accordion-group #group [isOpen]>
      <div accordion-heading>
        {{cat.value.name}}
        <fa-icon [icon]="group?.isOpen?faChevronDown:faChevronRight"></fa-icon>
      </div>
      <div>
        <cs-mmweapon [item]="optionHeader" ></cs-mmweapon>
        @for (item of cat.value.items; track item) {
          <cs-mmweapon [item]="item" ></cs-mmweapon>
        }
      </div>
    </accordion-group>
  }
</accordion>
<h4 >OPTIONS</h4>
<accordion>
  @for (cat of options; track cat) {
    <accordion-group #group [isOpen]>
      <div accordion-heading>
        {{cat.value.name}}
        <fa-icon [icon]="group?.isOpen?faChevronDown:faChevronRight"></fa-icon>
      </div>
      <div>
        <cs-mmoption [item]="optionHeader" ></cs-mmoption>
        @for (item of cat.value.items; track item) {
          <cs-mmoption [item]="item" ></cs-mmoption>
        }
      </div>
    </accordion-group >
  }
</accordion>
