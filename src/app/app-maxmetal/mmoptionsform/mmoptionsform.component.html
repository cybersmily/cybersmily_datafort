<div class="csd-rounded">
  <h4>Options</h4>
  <div>
    <span class="csd-required">Category</span>
    <select
      [(ngModel)]="selectedCategory"
      (change)="changeCategory()"
      class="form-control form-control-sm"
      >
      @if (!selectedCategory) {
        <option [ngValue]="null">
          Choose Option Category
        </option>
      }
      @for (category of options; track category) {
        <option [ngValue]="category">
          {{ category.key }}
        </option>
      }
    </select>
  </div>
  <div>
    <span class="csd-required">Option</span>
    <select
      [(ngModel)]="selectedOption"
      (change)="changeOption()"
      class="form-control form-control-sm"
      >
      @if (!selectedOption) {
        <option [ngValue]="null">Choose Option</option>
      }
      @for (opt of Options; track opt) {
        <option [ngValue]="opt">
          {{ opt.name }}
        </option>
      }
    </select>
  </div>
  @if (selectedOption) {
    <div id="cs-mm-opt-details">
      <div class="row">
        <div class="col-4">spaces: {{ currOptionSpaces | number: "1.0" }}</div>
        <div class="col-4">cost: {{ currOptionCost | number: "1.00" }}eb.</div>
        <div class="col-4">source: {{ currOption.source }}</div>
      </div>
      <div class="row">
        <div class="col-12">NOTES: {{ currOption.notes }}</div>
      </div>
    </div>
  }
  <div>
    <button
      class="btn btn-secondary btn-sm"
      (click)="addOpt()"
      [disabled]="addDisabled"
      >
      ADD
    </button>
  </div>
</div>
